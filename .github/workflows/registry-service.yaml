name: registry-service

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/registry-service

    # A throwaway PostgreSQL for the second test run, like the local agropilot-test-pg container.
    # Its password is the documented test password, not a secret.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: agropilot-local-test
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    # Actions are pinned to a full commit SHA: a tag can be moved, a commit cannot.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies
        run: uv sync --locked

      - name: Verify Python version
        run: uv run python --version

      # Coverage is checked over both runs: some lines run only on SQLite, others only on PostgreSQL.
      - name: Run tests on SQLite
        run: uv run pytest --cov --cov-fail-under=0 --cov-report=

      - name: Run tests on PostgreSQL and check 100% coverage
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:agropilot-local-test@127.0.0.1:5435/postgres
        run: uv run pytest --cov --cov-append --cov-report=term --cov-report=html

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: services/registry-service/htmlcov/
