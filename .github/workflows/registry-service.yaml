name: registry-service

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/registry-service

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # setup-uv publishes no floating major tag (no v10), only exact versions.
        uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest
