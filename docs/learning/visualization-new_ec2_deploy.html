<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;font:16px/1.65 system-ui,sans-serif;color:#17332e;background:#fafaf5}main{max-width:800px;margin:auto;padding:clamp(14px,4vw,32px)}nav{display:flex;gap:6px;flex-wrap:wrap}button,select{font:inherit;color:inherit;border:1px solid #a2b7ad;padding:6px 12px;background:#fff;border-radius:7px;cursor:pointer}button:disabled{opacity:.4}h2{line-height:1.25}section{padding:10px 0}aside{border-inline-start:3px solid #2e7764;padding-inline-start:14px}footer{display:flex;gap:8px}small{color:#486759}.flow{display:flex;align-items:center;flex-wrap:wrap;gap:10px;font-weight:600;color:#206753}.flow bdi{background:#e6f0e8;padding:5px 10px;border-radius:5px}select{max-width:100%}</style><main><label for="pick">מסלול הפריסה · בחירת שלב</label> <select id="pick"><option>1. נתוני הפתיחה</option><option>2. השרת הקיים</option><option>3. פריסה מ־GitHub</option><option>4. שרת בדיקה נקי</option><option>5. זיהוי ב־SSH</option><option>6. הקמה אוטומטית</option><option>7. השירות עולה</option><option>8. אתחול השרת</option><option>9. פריסה חוזרת</option></select><section aria-live="polite" id="panel"></section><footer><button id="prev">הקודם</button><button id="next">הבא ←</button></footer></main><script>const steps=[["נתוני הפתיחה","מה יש בשרת בפעם הראשונה שפותחים אותו?","Seed הוא אוסף נתונים התחלתיים. הכנו סקריפט שיודע ליצור קובץ SQLite ובו שתי חוות, ארבע חלקות ונתוני עזר. SQLite שומר את בסיס הנתונים בקובץ אחד.","seed_registry.sh","registry.db","הוראות היצירה נמצאות ב־Git. החוות שמוסיפים בהמשך נשמרות בקובץ שעל השרת."],["השרת הקיים","מה כבר עבד לפני PR 1?","על שרת ה־EC2 הראשון הכנו ידנית עותק של הקוד, סביבת Python ובסיס נתונים. systemd, מנהל השירותים של Linux, הפעיל את ה־Registry כדי שיענה לבקשות על חוות וחלקות.","systemd","Registry API","עד כאן ידענו לעדכן שרת שכבר הוכן. השאלה הבאה הייתה האם אותה פריסה תצליח גם על שרת ריק."],["פריסה מ־GitHub","מה מפעיל את הפריסה?","מיזוג PR 1 ל־main הפעיל workflow — סדרת צעדים ש־GitHub Actions מריץ. היעד היה שרת הייצור. ה־commit קבע איזו גרסה מדויקת של הקוד צריך להפעיל עליו.","Merge → main","GitHub Actions","בייצור בסיס הנתונים כבר היה קיים. הפריסה דילגה על יצירתו ובדיקות הבריאות עברו."],["שרת בדיקה נקי","מה הכנו בעצמנו ב־AWS?","הקמנו מחשב זמני בענן עם Ubuntu, כתובת IP ציבורית ו־Security Group שמאפשר חיבור SSH בפורט 22. בחרנו את אותו Key pair כדי שמפתח הכניסה הקיים יתאים גם כאן.","AWS EC2","Ubuntu","השרת קיבל כתובת ומפתחות זיהוי משלו. לקחנו מה־AWS console את טביעת האצבע שלו והעברנו אותה עם הכתובת להרצה ידנית."],["זיהוי ב־SSH","מי מזהה את מי?","לפני הרצת פקודות, GitHub Actions בודק את זהות השרת לפי ה־fingerprint — טביעת האצבע של המפתח הציבורי של השרת. בכיוון השני, השרת בודק ש־Actions מחזיק במפתח הכניסה הפרטי המורשה.","GitHub מזהה את השרת","השרת מאמת את הלקוח","בניסוי הראשון מסרנו את טביעת האצבע של שרת הייצור עם כתובת שרת הבדיקה. התקבל fingerprint mismatch והחיבור נעצר לפני הרצת פקודות."],["הקמה אוטומטית","מה קרה כשה־fingerprint התאים?","ה־workflow התחבר, בדק ש־Git זמין, הוריד את המאגר ובחר את ה־commit. על השרת רץ deploy.sh: הוא התקין כלים חסרים והכין בעזרת uv את סביבת ה־Python לפי רשימת הגרסאות הנעולה.","GitHub Actions","deploy.sh על EC2","בשרת הנקי registry.db היה חסר. הסקריפט יצר את נתוני ה־seed בקובץ זמני ורק אחרי הצלחה נתן לו את השם registry.db."],["השירות עולה","איך יודעים שהאפליקציה באמת עובדת?","הסקריפט כתב את הגדרות החיבור ל־SQLite בקובץ ‎.env והתקין את registry.service — ההוראות של systemd להרצת האפליקציה. הוא הגדיר הפעלה בעת אתחול והפעיל את השירות כמשתמש ubuntu.","systemd","Registry API","הבקשה ‎/health בדקה שהאפליקציה עונה. הבקשה ‎/v1/crops בדקה שהיא גם מצליחה לקרוא נתונים. שתיהן עברו."],["אתחול השרת","מה קורה אם כל המחשב עולה מחדש?","ביצענו reboot. אחרי שהתחברת מחדש השתנה ה־boot ID, המזהה של האתחול הנוכחי. systemd העלה את השירות אוטומטית.","EC2 reboot","registry.service","בדקת בעצמך: השירות היה active והבקשה ל־‎/health החזירה ok."],["פריסה חוזרת","האם חווה שהוספנו שורדת deploy?","יצרנו חווה דרך ה־API ושמרנו את ה־ID שלה. פרסנו שוב את אותו commit. הסקריפט מצא קובץ SQLite קיים, דילג על ה־seed והפעיל מחדש את השירות.","יצירת חווה ← פריסה חוזרת","קריאה לפי ID","קיבלנו 200 עם אותו ID ואותו שם. אחרי מחיקת חוות הבדיקה קיבלנו 404. כאן מסתיים PR 1: ה־Registry עובד עם SQLite. ה־frontend ו־PostgreSQL שייכים לשלב הבא."]];const pick=document.querySelector('#pick'),panel=document.querySelector('#panel'),prev=document.querySelector('#prev'),next=document.querySelector('#next');function show(i){pick.selectedIndex=i;const [name,title,body,a,b,result]=steps[i];panel.innerHTML='<small>שלב '+(i+1)+' מתוך '+steps.length+'</small><h2>'+title+'</h2><div class="flow"><bdi>'+a+'</bdi><span aria-hidden="true">←</span><bdi>'+b+'</bdi></div><p>'+body+'</p><aside>'+result+'</aside>';prev.disabled=i===0;next.disabled=i===steps.length-1}prev.onclick=()=>show(pick.selectedIndex-1);next.onclick=()=>show(pick.selectedIndex+1);pick.onchange=()=>show(pick.selectedIndex);show(0);</script></html>
