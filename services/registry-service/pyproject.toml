[project]
name = "registry-service"
version = "0.1.0"
description = "AgroPilot registry service."
requires-python = ">=3.12"
dependencies = [
    "fastapi~=0.121",
    "psycopg[binary]~=3.3",
    "python-dotenv~=1.0",
    "sqlalchemy~=2.1",
    "uvicorn~=0.32",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx2~=2.16",
    "pytest~=9.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "sqlite_only: needs the SQLite backend",
    "postgres_only: needs TEST_DATABASE_URL",
]
