[project]
name = "weather-service"
version = "0.1.0"
description = "AgroPilot weather service."
requires-python = ">=3.12"
dependencies = [
    "fastapi~=0.121",
    "httpx2~=2.16",
    "pydantic-settings~=2.16",
    "uvicorn~=0.32",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest~=9.2",
    "pytest-cov~=7.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 100
